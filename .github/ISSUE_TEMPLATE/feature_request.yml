name: 功能建议 / Feature Request
description: 提出新功能、排版优化或文档改进建议 / Suggest an enhancement, layout improvement, or documentation update
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出改进建议！如果是词典内容本身（如某词条漏译），请同时注明对应单词，以便判断属于上游 ECDICT 数据问题还是本仓库转换/排版问题。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景或希望解决的问题 / Problem or Use Case
      description: 请说明你遇到什么痛点，或在什么场景下需要该功能。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案 / Proposed Solution
      description: 你希望实现怎样的效果或交互？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案或补充说明 / Alternatives or Additional Context
      description: 如有参考样例、截图或其他说明可在此补充。
    validations:
      required: false
