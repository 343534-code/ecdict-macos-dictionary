name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-semantic.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-semantic.txt

      - name: Validate Python syntax
        run: python -m compileall -q scripts semantic_cleanup tests

      - name: Validate MyInfo.plist XML
        run: |
          python -c "
          import plistlib
          import xml.etree.ElementTree as ET

          plist_path = 'dictionary-source/MyInfo.plist'
          ET.parse(plist_path)
          with open(plist_path, 'rb') as fp:
              data = plistlib.load(fp)
          version = data.get('CFBundleShortVersionString')
          assert isinstance(version, str) and version.strip(), 'Missing CFBundleShortVersionString'
          print(f'MyInfo.plist valid (CFBundleShortVersionString={version})')
          "

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Lint shell scripts
        run: |
          bash -n scripts/install.sh scripts/build_pkg.sh packaging/scripts/postinstall
          shellcheck scripts/install.sh scripts/build_pkg.sh packaging/scripts/postinstall
